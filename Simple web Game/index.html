<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Typing Speed Test</h1>
    <div id="wordDisplay" class="word-display"></div>
    <input type="text" id="typedInput" class="typed-input" disabled placeholder="Start typing...">
    <div class="stats">
      <span>Time Left: <span id="time">30</span> seconds</span>
      <span>WPM: <span id="wpm">0</span></span>
      <span>Accuracy: <span id="accuracy">100</span>%</span>
    </div>
    <button id="restartBtn">Restart</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
